[workspace]
resolver = "3"
members = ["apps/desktop/src-tauri", "crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
pc-core = { path = "crates/pc-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
runtime-postgres = { path = "crates/runtime-postgres" }
driver-postgres = { path = "crates/driver-postgres" }
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "macros", "process", "net", "time", "fs", "io-util", "sync"] }
tokio-util = "0.7"

[workspace.lints.rust]
# deny (not forbid) so a module can opt in with #![allow(unsafe_code)] for unavoidable OS calls
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Small, fast release builds: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Keep dev builds of dependencies optimised so the app stays responsive while developing
[profile.dev.package."*"]
opt-level = 2
