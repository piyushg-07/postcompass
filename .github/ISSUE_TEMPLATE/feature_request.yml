name: Feature request
description: Suggest an idea or improvement for PostCompass
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Please check the [roadmap](https://github.com/piyushg-07/postcompass#readme) and [existing issues](https://github.com/piyushg-07/postcompass/issues) first.
        Open-ended questions and brainstorming are welcome in [Discussions](https://github.com/piyushg-07/postcompass/discussions).

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
      placeholder: "I often need to ... but currently I have to ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work? Mockups or screenshots from other tools are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've tried.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Local databases
        - Cloud connections
        - Table editor
        - Schema tools
        - SQL editor
        - ER diagram
        - Backup and restore
        - Installers / platform support
        - Other
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd be willing to open a pull request for this
