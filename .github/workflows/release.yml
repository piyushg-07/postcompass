# Builds PostCompass for Windows, macOS and Linux and attaches the installers to a GitHub Release.
#
# Runs only when commits are pushed to the `release` branch.
#
# How to release:
#   1. Bump "version" in apps/desktop/src-tauri/tauri.conf.json (e.g. 0.2.0) and commit.
#   2. Push that commit to the release branch:
#        git push origin HEAD:release
#   3. Wait for this workflow to finish (Actions tab). It creates the tag v0.2.0 and a draft
#      release "PostCompass v0.2.0"; open Releases, edit the notes if you like, and Publish.
#
# Each release needs a new version number: pushing again with the same version updates the
# draft for that version instead of creating a new one, and a version that's already
# published is refused, so its installers are never replaced.
#
# The jobs run in three steps so that no two of them ever change the same file:
#   1. create-release makes (or finds) the draft release, once.
#   2. build (one job per platform) uploads that platform's installers and their .sig files.
#   3. updater-json writes latest.json, which installed apps read to find updates, once,
#      after every platform has built. If any build failed it doesn't run, so a release
#      never ships with an update file that's missing a platform. "Re-run failed jobs"
#      rebuilds the failed platform and then runs this step too.

name: Release

on:
  push:
    branches:
      - release

# A second push waits for the running release to finish instead of racing it
concurrency:
  group: release
  cancel-in-progress: false

# Creating a release and uploading files needs write access to the repository contents
permissions:
  contents: write

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out the app config
        uses: actions/checkout@v4
        with:
          sparse-checkout: apps/desktop/src-tauri/tauri.conf.json
          sparse-checkout-cone-mode: false

      - name: Create or find the draft release
        id: release
        uses: actions/github-script@v7
        env:
          # Before publishing, replace the "Highlights" bullets in the draft with what's new in this version.
          # __VERSION__ is replaced with the version from tauri.conf.json.
          RELEASE_BODY: |
            **PostCompass v__VERSION__** is here. A fast, modern desktop app for PostgreSQL: run local databases in one click, connect to the cloud, and browse, edit and query your data in one place.

            ## ✨ Highlights

            - **One-click local PostgreSQL 14 to 18.** Installed and run for you, no admin rights needed
            - **In-app updates.** PostCompass tells you when a new version is out and installs it in one click
            - **Cloud connections.** AWS RDS, Google Cloud SQL, Azure, DigitalOcean, Neon and any PostgreSQL, with passwords in your system keychain
            - **Table editor.** Inline editing, filters, sorting and foreign-key navigation
            - **SQL editor.** Autocomplete, query history and visual `EXPLAIN ANALYZE`
            - **ER diagram, command palette (`Ctrl+K`), backup and restore**

            ## 📦 Download

            | Platform | Installer |
            |---|---|
            | **Windows** 10 / 11 (x64) | [**PostCompass___VERSION___x64-setup.exe**](https://github.com/piyushg-07/postcompass/releases/download/v__VERSION__/PostCompass___VERSION___x64-setup.exe) |
            | **macOS** Apple Silicon (M1 or newer) | [**PostCompass___VERSION___aarch64.dmg**](https://github.com/piyushg-07/postcompass/releases/download/v__VERSION__/PostCompass___VERSION___aarch64.dmg) |
            | **macOS** Intel | [**PostCompass___VERSION___x64.dmg**](https://github.com/piyushg-07/postcompass/releases/download/v__VERSION__/PostCompass___VERSION___x64.dmg) |
            | **Linux** (any distro) | [**.AppImage**](https://github.com/piyushg-07/postcompass/releases/download/v__VERSION__/PostCompass___VERSION___amd64.AppImage) |
            | **Linux** Ubuntu / Debian | [**.deb**](https://github.com/piyushg-07/postcompass/releases/download/v__VERSION__/PostCompass___VERSION___amd64.deb) |
            | **Linux** Fedora / RHEL | [**.rpm**](https://github.com/piyushg-07/postcompass/releases/download/v__VERSION__/PostCompass-__VERSION__-1.x86_64.rpm) |

            ## 🛡️ If your system shows a warning

            PostCompass isn't code-signed yet, so your system may warn you when you install or open it:

            - **Windows:** the installer shows *Unknown publisher*. On the SmartScreen prompt, click **More info → Run anyway**.
            - **macOS:** drag PostCompass to Applications and open it. When macOS says it can't verify the app, open **System Settings → Privacy & Security**, scroll down and click **Open Anyway**.
            - **macOS, if it says the app "is damaged":** run `xattr -cr /Applications/PostCompass.app` in Terminal, then open it again.
            - **Linux (AppImage):** run `chmod +x PostCompass_*.AppImage && ./PostCompass_*.AppImage` (on Ubuntu 22.04+, install `libfuse2` if needed).
            - **Linux (.deb):** run `sudo apt install ./PostCompass_*_amd64.deb`.
            - **Linux (.rpm):** run `sudo dnf install ./PostCompass-*.x86_64.rpm`.

            ## 💬 Feedback

            Found a bug or have an idea? [Open an issue](https://github.com/piyushg-07/postcompass/issues/new). If PostCompass is useful to you, a ⭐ on the repo helps a lot.
        with:
          script: |
            const fs = require("fs");
            const { version } = JSON.parse(fs.readFileSync("apps/desktop/src-tauri/tauri.conf.json", "utf8"));
            const tag = `v${version}`;

            // Drafts aren't returned by the get-release-by-tag endpoint, so look through the list
            const releases = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            let release = releases.find((r) => r.tag_name === tag);
            if (release && !release.draft) {
              core.setFailed(`${tag} is already published. Bump "version" in apps/desktop/src-tauri/tauri.conf.json to release again.`);
              return;
            }
            if (!release) {
              release = (
                await github.rest.repos.createRelease({
                  ...context.repo,
                  tag_name: tag,
                  target_commitish: context.sha,
                  name: `PostCompass ${tag}`,
                  body: process.env.RELEASE_BODY.replaceAll("__VERSION__", version),
                  draft: true,
                  prerelease: false,
                })
              ).data;
              core.info(`Created draft release ${tag}`);
            } else {
              core.info(`Updating the existing draft release ${tag}`);
            }
            core.setOutput("release_id", String(release.id));
            core.setOutput("version", version);

  build:
    name: Build (${{ matrix.name }})
    needs: create-release
    strategy:
      # One platform failing shouldn't cancel the others
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            args: ""
          - name: macOS (Apple Silicon)
            platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - name: macOS (Intel)
            platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - name: Linux
            platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install Linux system libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # WebKitGTK for the window, plus D-Bus for the system keychain (keyring crate)
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - name: Set up pnpm
        # Uses the version pinned in package.json ("packageManager")
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Both Mac architectures are built on the same Apple Silicon runner
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust builds
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.args }}

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update packages so installed apps can verify them (in-app updates).
          # The matching public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }} --ignore-version-mismatches
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # latest.json is written once by the updater-json job; four jobs editing it at once
          # made uploads fail with "Not Found" and could drop a platform from it
          includeUpdaterJson: false

  updater-json:
    name: Write latest.json
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Build latest.json from the uploaded signatures
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          VERSION: ${{ needs.create-release.outputs.version }}
        with:
          script: |
            // Same format tauri-action writes: a `{os}-{arch}` entry with the default installer for each
            // platform, plus `{os}-{arch}-{installer}` entries the updater uses to match how the app was installed
            const { owner, repo } = context.repo;
            const releaseId = Number(process.env.RELEASE_ID);
            const version = process.env.VERSION;
            const tag = `v${version}`;

            const UPDATERS = [
              { suffix: "_x64-setup.exe", os: "windows", arch: "x86_64", installer: "nsis", main: true },
              { suffix: "_aarch64.app.tar.gz", os: "darwin", arch: "aarch64", installer: "app", main: true },
              { suffix: "_x64.app.tar.gz", os: "darwin", arch: "x86_64", installer: "app", main: true },
              { suffix: "_amd64.AppImage", os: "linux", arch: "x86_64", installer: "appimage", main: true },
              { suffix: "_amd64.deb", os: "linux", arch: "x86_64", installer: "deb" },
              { suffix: ".x86_64.rpm", os: "linux", arch: "x86_64", installer: "rpm" },
            ];

            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: releaseId, per_page: 100,
            });
            const names = new Set(assets.map((a) => a.name));

            const platforms = {};
            for (const asset of assets) {
              if (!asset.name.endsWith(".sig")) continue;
              const file = asset.name.slice(0, -".sig".length);
              const updater = UPDATERS.find((u) => file.endsWith(u.suffix));
              if (!updater || !names.has(file)) continue;

              // The release is still a draft, so its files are read through the API rather than public links
              const { data } = await github.request("GET /repos/{owner}/{repo}/releases/assets/{asset_id}", {
                owner, repo, asset_id: asset.id, headers: { accept: "application/octet-stream" },
              });
              const entry = {
                signature: Buffer.from(data).toString("utf8"),
                // The tag's link, which works once the draft is published
                url: `https://github.com/${owner}/${repo}/releases/download/${tag}/${encodeURIComponent(file)}`,
              };
              platforms[`${updater.os}-${updater.arch}-${updater.installer}`] = entry;
              if (updater.main) platforms[`${updater.os}-${updater.arch}`] = entry;
            }

            const missing = ["windows-x86_64", "darwin-aarch64", "darwin-x86_64", "linux-x86_64"].filter((k) => !platforms[k]);
            if (missing.length) {
              core.setFailed(`No signed update file found for: ${missing.join(", ")}. latest.json was not written.`);
              return;
            }

            const { data: release } = await github.rest.repos.getRelease({ owner, repo, release_id: releaseId });
            const latest = JSON.stringify(
              { version, notes: release.body ?? "", pub_date: new Date().toISOString(), platforms },
              null,
              2,
            );

            // Replace the file if this step is re-run
            const existing = assets.find((a) => a.name === "latest.json");
            if (existing) await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: existing.id });
            await github.rest.repos.uploadReleaseAsset({
              owner, repo, release_id: releaseId, name: "latest.json", data: latest,
              headers: { "content-type": "application/json" },
            });
            core.info(`Uploaded latest.json with ${Object.keys(platforms).sort().join(", ")}`);
