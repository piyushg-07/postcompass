[package]
name = "desktop"
description = "PostCompass desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (Windows quirk: rust-lang/cargo#8519)
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pc-core.workspace = true
runtime-postgres.workspace = true
driver-postgres.workspace = true
tokio.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "0.0.12"

[lints]
workspace = true
